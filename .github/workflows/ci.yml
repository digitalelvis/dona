name: CI

on:
  pull_request:
    branches:
      - v0.1.x
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -w turbo run test

      - name: Build
        run: pnpm -w turbo run build

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GHA_STAGING_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false

      - name: Terraform init / validate / plan (api staging)
        working-directory: infra/terraform/stacks/api
        env:
          TF_IN_AUTOMATION: true
        run: |
          terraform init -input=false -backend-config=backends/staging.hcl
          terraform validate
          terraform plan -input=false -var-file=envs/staging.tfvars
